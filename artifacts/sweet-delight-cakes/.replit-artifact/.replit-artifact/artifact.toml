kind = "web"
previewPath = "/"
title = "Sweet Delight Cakes"
description = "A premium responsive bakery storefront for browsing custom cakes, exploring the menu, building a cart, and moving through a polished checkout experience."
version = "1.0.0"
id = "artifacts/sweet-delight-cakes"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23792

[services.development]
run = "pnpm --filter @workspace/sweet-delight-cakes run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sweet-delight-cakes", "run", "build" ]
serve = "static"
publicDir = "artifacts/sweet-delight-cakes/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23792"
BASE_PATH = "/"
